name: Release
on:
  push:
    branches: [main]
    paths: ['build/version.txt']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release version
        id: version
        shell: pwsh
        run: |
          $tag = "v" + (Get-Content build/version.txt -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq "tag") { $tag = $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release version" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: go test ./internal/board
      - run: go run github.com/tc-hib/go-winres@v0.3.3 make --in build/windows/winres.json --arch amd64 --out rsrc
      - run: go build -trimpath -ldflags="-H windowsgui -s -w" -o build/bin/Kotorima.exe .
      - name: Native notification verification
        shell: pwsh
        run: |
          go build -tags nativesmoke -o build/bin/native-smoke.exe .
          $env:KOTORIMA_DATA_DIR = Join-Path $env:RUNNER_TEMP "kotorima-release-test"
          $p = Start-Process build/bin/native-smoke.exe -PassThru -RedirectStandardOutput native-output.txt -RedirectStandardError native-error.txt
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "Native verification timed out" }
          if (-not (Test-Path native-smoke.json)) { throw "Native verification did not produce a result" }
          Get-Content native-smoke.json
          if ($p.ExitCode -ne 0) { throw "Native process exited with $($p.ExitCode)" }
          $result = Get-Content native-smoke.json -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw $result.error }
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable | Out-Null
          Copy-Item build/bin/Kotorima.exe portable/
          Copy-Item README.md portable/
          Copy-Item LICENSE portable/
          Copy-Item THIRD_PARTY_NOTICES.txt portable/
          Compress-Archive -Path portable/* -DestinationPath kotorima-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kotorima-windows-amd64
          path: kotorima-windows-amd64.zip
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "This release already exists; refusing to overwrite it" }
          gh release create $env:RELEASE_TAG kotorima-windows-amd64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Kotorima $env:RELEASE_TAG" --notes-file build/release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
